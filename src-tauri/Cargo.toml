[package]
name = "lapower"
version.workspace = true
description = "laPower"
authors = ["KHWLGH"]
edition = "2021"
default-run = "lapower"
repository = "https://github.com/KHWLGH/laPower"
homepage = "https://github.com/KHWLGH/laPower"
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lapower_lib"
# rlib only. staticlib + cdylib are the mobile link forms, and no gen/android or gen/apple
# scaffolding exists, no mobile target is installed, and main.rs only ever calls
# lapower_lib::run(). Measured on this host: a lib-only `cargo build` relink 4.35s as rlib vs
# 6.34s with all three (the first build after switching to three costs ~19s while the extra
# link forms are built cold). Modest, but it is on the daily path and buys nothing here.
# Revisit if mobile ever becomes real.
crate-type = ["rlib"]

# criterion drives its own harness; without this cargo would also try to build it as a
# libtest bench and reject criterion_main.
[[bench]]
name = "stream"
harness = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tauri-build checks this declaration even when a platform config is merged.
# Keep it in sync with app.macOSPrivateApi; the API only affects macOS.
tauri = { version = "2", features = ["macos-private-api"] }
serde.workspace = true
serde_json.workspace = true
hidapi.workspace = true
witrn-hid.workspace = true
km003c.workspace = true
tauri-plugin-dialog = "2.4.2"
tauri-plugin-fs = "2.4.4"
tauri-plugin-store = "2.4.1"
tauri-plugin-decorum = "1.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Set the process-wide policy once during hidapi initialization, before any opens.
hidapi = { workspace = true, features = ["macos-shared-device"] }
# App Nap opt-out while a reader runs (src/app_nap.rs); already in the graph through tao/wry.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging"
] }

[dev-dependencies]
criterion = "0.5"
