name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs of the same ref, including failed tag reruns. Never cancel a release upload.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native Tauri and HID dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          libxdo-dev libssl-dev libudev-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript tooling
        run: npm ci

      # frontendDist points at out/, which tauri-codegen embeds at macro-expansion time. Without
      # it `generate_context!` fails inside every cargo invocation, including the Rust steps below
      # -- so this is a cargo prerequisite, not a frontend step.
      - name: Build the frontend distribution
        run: npm run build

      - name: Test JavaScript pure logic
        run: npm test

      # 清单和锁文件的版本号一致性由 test/version-sync.test.js 断言（上一步）。
      # 这里补上另一半：打 tag 时确认 tag 名和清单里的版本号对得上。
      - name: Verify tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          manifest=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与清单版本 ${manifest} 不一致"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} 与清单版本 ${manifest} 一致"

      - name: Type check JavaScript
        run: npm run typecheck

      - name: Lint and format frontend files with Biome
        run: npm run lint

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --check --all

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace

  backend-other-platforms:
    strategy:
      matrix:
        include:
          - os: windows-latest
            run_tests: true
          # macOS has its own code paths (App Nap activity, shared HID opens,
          # usb_port location IDs); run the suite there, not only cargo check.
          - os: macos-latest
            run_tests: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # cargo cannot even expand here without out/: tauri-codegen embeds frontendDist at compile
      # time, so the Rust-only jobs still need the Node build step.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build the frontend distribution
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test Rust workspace
        if: matrix.run_tests
        run: cargo test --workspace

      - name: Check Rust workspace
        if: ${{ !matrix.run_tests }}
        run: cargo check --workspace --all-targets

  crate-features:
    name: Crate feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只有 witrn-hid 需要 HID 依赖；两个 crate 都不依赖 WebView。
      - name: Install HID dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # 默认特性组合已由 validate 覆盖，这里只跑非默认组合：
      # 漏标的 #[cfg(feature = ...)] 只在关掉某个特性时才会暴露。
      - name: Lint and test non-default feature combinations
        run: |
          set -euo pipefail
          combos=(
            "-p usbpd-parser --no-default-features"
            "-p usbpd-parser --no-default-features --features serde"
            "-p usbpd-parser --no-default-features --features vendor-ids"
            "-p usbpd-parser --all-features"
            "-p witrn-hid --no-default-features"
            "-p witrn-hid --all-features"
          )
          for combo in "${combos[@]}"; do
            echo "::group::cargo $combo"
            cargo clippy $combo --all-targets -- -D warnings
            cargo test $combo
            echo "::endgroup::"
          done

  # Two kinds of check, split by whether they can lie.
  #
  # Deterministic and therefore hard-gated: the shipped shape (byte counts, request counts,
  # unreferenced assets that tauri-codegen would embed anyway) and the structural baseline check
  # (input fingerprints, gated-metric set, run/pass counts). Neither reads a duration, so neither
  # can be flapped by a noisy neighbour on a shared runner.
  #
  # Timing is reported, not gated: measured on one host, three back-to-back runs of UNCHANGED code
  # spread from 1.12x to 1.50x across every gated op, and a single-pass verdict produced a false
  # regression at adjusted x1.20 that did not repeat. bench:core --compare already defends itself
  # against that (drift normalisation + 3-pass corroboration) but the margin is not yet known on
  # runner hardware, so it reports for now. Flip the continue-on-error off only once it has been
  # observed quiet, and keep --verify-baseline in `validate` so a hand-edited baseline stays red.
  perf-shape:
    name: Perf gate (deterministic shape + timing report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript tooling
        run: npm ci

      - name: Shipped shape assertions
        run: |
          npm run build
          node bench/packaging.mjs

      - name: Verify the committed baseline still describes this bench
        run: node bench/core.mjs --verify-baseline --output bench/results/verify.json

      - name: Algorithm timings (report only)
        continue-on-error: true
        # stderr goes into the summary on purpose. `2>/dev/null` here once hid the only message that
        # explains a missing/invalid baseline ("找不到 ... 先用 --baseline 生成它"), so the step
        # produced an empty summary and looked like "nothing to report" instead of "did not run".
        run: |
          node bench/core.mjs --compare --output bench/results/core-ci.json 2>&1 \
            | tee "$GITHUB_STEP_SUMMARY"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install HID dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: cargo bench (report only)
        continue-on-error: true
        timeout-minutes: 20
        # Report-only, and not promotable to a gate as measured: three runs of an UNCHANGED tree at
        # these settings (3s measurement, 30 samples) put decode/general_sample at +11.7% "regressed"
        # and then -2.5% "improved", and selection/offer_select_retain at +8.4% then +19.9% -- all
        # with criterion reporting p < 0.05. Its significance test covers sampling within a run, not
        # host state, so the sign flips. See CHANGELOG for the same numbers.
        run: |
          cargo bench -p lapower --bench stream -- --warm-up-time 1 --measurement-time 3 --sample-size 30 \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: bench/results/
          if-no-files-found: ignore
          overwrite: true

  package:
    name: Package (${{ matrix.package }})
    needs: [validate, backend-other-platforms, crate-features, perf-shape]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - package: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - package: macos-x64
            os: macos-26-intel
            target: x86_64-apple-darwin
            # Tauri removes the intermediate .app after a DMG-only build; keep it for verification.
            bundles: app,dmg
            architecture: x86_64
          - package: macos-arm64
            os: macos-26
            target: aarch64-apple-darwin
            bundles: app,dmg
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CI: 'true'
      # tauri-action defaults this to true, which re-enables Finder AppleScript on CI.
      TAURI_BUNDLER_DMG_IGNORE_CI: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked JavaScript tooling and Tauri CLI
        run: npm ci

      - name: Install Linux packaging and device dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential curl file pkg-config libssl-dev libudev-dev
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libxdo-dev patchelf libfuse2 xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: package-${{ matrix.target }}

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo 'MACOSX_DEPLOYMENT_TARGET=12.0' >> "$GITHUB_ENV"

      - name: Remove installers restored from the Rust cache
        env:
          PACKAGE_ID: ${{ matrix.package }}
        run: node scripts/release.mjs clean

      # Tauri runs beforeBuildCommand itself, producing the minified frontend.
      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        with:
          tauriScript: npx --no-install tauri
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Verify macOS architecture, signature, deployment target and DMG
        if: runner.os == 'macOS'
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
          PACKAGE_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          bundle="target/$PACKAGE_TARGET/release/bundle"
          app="$bundle/macos/laPower.app"
          binary="$app/Contents/MacOS/lapower"
          test "$(lipo -archs "$binary")" = "$PACKAGE_ARCH"
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -F 'Signature=adhoc'
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = '12.0'
          xcrun vtool -show-build "$binary" | grep -E 'minos[[:space:]]+12\.0([[:space:]]|$)'
          shopt -s nullglob
          images=("$bundle"/dmg/*.dmg)
          test "${#images[@]}" -eq 1
          hdiutil verify "${images[0]}"

      - name: Collect and validate installers
        env:
          PACKAGE_ID: ${{ matrix.package }}
        run: node scripts/release.mjs collect

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.package }}
          path: dist/packages/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  package-summary:
    name: Verify all release packages
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist/packages/

      - name: Require seven installers and generate checksums
        run: node scripts/release.mjs verify

      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/packages/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: package-summary
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/packages/

      - name: Upload, verify and publish the complete release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs publish
